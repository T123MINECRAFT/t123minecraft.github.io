name: Deploy Hexo Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Install dependencies
        run: npm install

      - name: Clean and generate
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public   # Hexo 默认生成到 public 文件夹
          publish_branch: gh-pages

      - name: Clean and generate
        run: |
          npx hexo clean
          npx hexo generate

      - name: Debug generated files
        run: |
          echo "=== public directory tree ==="
          ls -laR public/
          echo "=== index.html first 20 lines ==="
          head -n 20 public/index.html || echo "index.html not found or empty"