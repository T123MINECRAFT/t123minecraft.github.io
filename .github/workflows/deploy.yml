name: Deploy Hexo Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Install dependencies
        run: npm install

      - name: Clean and generate
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      - name: Debug generated files
        run: |
          echo "=== public directory tree ==="
          ls -laR public/
          echo "=== index.html first 20 lines ==="
          head -n 20 public/index.html || echo "index.html not found or empty"

      - name: Debug build output
        run: |
          echo "=== Node.js version ==="
          node -v
          echo "=== Hexo version ==="
          npx hexo version
          echo "=== Public directory tree ==="
          ls -laR public/
          echo "=== index.html content (first 20 lines) ==="
          if [ -f public/index.html ]; then
            head -n 20 public/index.html
          else
            echo "public/index.html not found!"
          fi
          echo "=== Hexo generate full log ==="
          # 重新运行一次并捕获详细输出
          npx hexo generate --verbose 2>&1 | tee hexo-output.log
          echo "=== Looking for errors/warnings in generate ==="
          grep -i "error\|warn\|fatal" hexo-output.log || echo "No obvious errors"